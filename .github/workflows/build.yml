name: build

# Sidecar deployment model: every push to main builds + publishes a
# single `:latest` image to GHCR. No canary/stable split, no version
# tags, no `/release` flow — sidecars don't carry the same blast radius
# as the vorrat app itself, and the consuming `vorrat-services`
# TrueNAS app stack pulls `:latest` via Watchtower. See vorrat ADR-0035
# §2 for the rationale.

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA + commit date
        id: meta
        run: |
          {
            echo "sha7=$(git rev-parse --short=7 HEAD)"
            echo "date=$(git log -1 --date=format:%Y.%-m.%-d --format=%cd HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      # Build amd64 into the local Docker daemon FIRST so the smoke
      # test can boot it (`load: true` requires single-arch). The push
      # step below reuses the same cache, so the second build is
      # essentially a re-tag-and-push.
      - name: Build amd64 image locally for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: receipt-ocr:smoke
          build-args: |
            VORRAT_BUILD_CHANNEL=main
            VORRAT_BUILD_SHA=${{ steps.meta.outputs.sha7 }}
            VORRAT_BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke test — boot container, hit /healthz, /ocr-receipt 503
        run: |
          set -euo pipefail
          # CI runs with the engine disabled — the ~100 MB PaddleOCR
          # model download would slow every commit's pipeline. The
          # disable-engine path runs as _UnloadedStub, mirroring the
          # off-classifier's CI smoke pattern (model_repo="" → stub).
          # Real-engine verification happens on the live server after
          # Watchtower deploys this image, by curling /healthz and
          # observing model_loaded:true once the engine warms up.
          docker run -d --name receipt-ocr-smoke -p 8003:8003 \
            -e RECEIPT_OCR_DISABLE_ENGINE=true \
            receipt-ocr:smoke
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8003/healthz > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          healthz=$(curl -fsS http://localhost:8003/healthz)
          echo "healthz: $healthz"
          echo "$healthz" | grep -q '"ok":true'
          echo "$healthz" | grep -q '"channel":"main"'
          echo "$healthz" | grep -q "\"commit\":\"${{ steps.meta.outputs.sha7 }}\""
          # Engine disabled in CI ⇒ stub state.
          echo "$healthz" | grep -q '"model_loaded":false'
          echo "$healthz" | grep -q '"model_id":"unloaded"'
          # /ocr-receipt 503s when the runner is the unloaded stub
          # (Phase 2a). Phase 2b will keep the 503 path for stub mode
          # and add the real-tokens path when the engine is loaded.
          status=$(curl -s -o /tmp/body.json -w "%{http_code}" -X POST \
            -F "image=@-;filename=fake.jpg;type=image/jpeg" \
            http://localhost:8003/ocr-receipt < /dev/null)
          echo "/ocr-receipt status: $status"
          [ "$status" = "503" ]
          grep -q "model not loaded" /tmp/body.json

      - name: Show container logs on smoke failure
        if: failure()
        run: docker logs receipt-ocr-smoke || true

      - name: Stop smoke container
        if: always()
        run: docker rm -f receipt-ocr-smoke || true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64) as :latest
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/receipt-ocr:latest
          build-args: |
            VORRAT_BUILD_CHANNEL=main
            VORRAT_BUILD_SHA=${{ steps.meta.outputs.sha7 }}
            VORRAT_BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
