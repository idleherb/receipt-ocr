[project]
name = "receipt-ocr"
version = "0.0.1"
description = "Printed-receipt photo to structured per-line tokens. Sidecar in the vorrat-services TrueNAS app stack; consumed by the vorrat household-pantry app's receipt-photo intake flow per vorrat ADR-0039. Phase 1 (this build): walking-skeleton with /healthz only — OCR engine + parsing rules land in subsequent commits."
readme = "README.md"
requires-python = ">=3.12,<3.14"  # paddlepaddle wheels currently cap at cp313; revisit once cp314 lands upstream
license = { text = "deferred" }
authors = [{ name = "idleherb" }]

dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # Required by FastAPI's UploadFile / multipart-form parsing —
    # /ocr-receipt accepts an image upload.
    "python-multipart>=0.0.18",
    # OCR engine. PaddleOCR ships its own model files via PPaddle's
    # CDN on first init; we keep them on a named Docker volume mounted
    # at /models. paddlepaddle is the framework backbone (CPU build);
    # numpy + Pillow are pulled in transitively but pinned here for
    # explicitness.
    "paddleocr>=2.7",
    "paddlepaddle>=2.6",
    "numpy>=1.26,<2.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.13",
    "ty>=0.0.1a16",
    "asgi-lifespan>=2.1",
    "httpx>=0.28",
    "diff-cover>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipt_ocr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF", "PL",
]
ignore = ["PLR0913"]  # too-many-arguments — FastAPI route signatures need them

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # magic numbers in tests are fine
# RUF001 (ambiguous unicode chars) is the right rule in general, but
# the line_parser's regex deliberately matches the unicode times-sign
# (×, U+00D7) some receipts use as a multiplier symbol; the schemas
# docstring uses × in a math expression. Accept the deliberate use.
"src/receipt_ocr/parsing/line_parser.py" = ["RUF001"]
"src/receipt_ocr/schemas.py" = ["RUF001"]

[tool.pytest.ini_options]
addopts = """
    --strict-markers
    --strict-config
    --cov=src/receipt_ocr
    --cov-branch
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=90
"""
asyncio_mode = "auto"
testpaths = ["tests"]
log_level = "WARNING"

[tool.coverage.run]
branch = true
source = ["src/receipt_ocr"]
omit = ["src/receipt_ocr/inference/paddle_runner.py"]
# paddle_runner is the thin wrapper around PaddleOCR; testing it
# requires the model files on disk (~100 MB pulled from PaddlePaddle's
# CDN on first init). Behaviour is verified via the integration smoke
# flow (Docker container with the real engine, hit /ocr-receipt
# against a fixture image) and on the live server post-Watchtower-
# deploy.

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
